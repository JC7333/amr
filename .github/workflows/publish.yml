name: Publish to PyPI

# Publishes the "mandatia" package to PyPI when a version tag (v0.1.0, v0.2.0, ...) is pushed.
# No token is stored anywhere: PyPI trusts this workflow through "trusted publishing"
# (OpenID Connect), declared once on pypi.org for the repository JC7333/amr, the workflow
# publish.yml and the environment "pypi". The environment "pypi" must require the owner's
# approval, and only commits already on main are published. Steps: docs/release.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag matches pyproject.toml and server.json
        run: python3 .github/scripts/check_release_version.py "$GITHUB_REF_NAME"
      - name: Install
        run: uv sync --locked --extra dev
      - name: Tests
        run: uv run python -m pytest -q
      - name: Ruff (security rules included)
        run: uv run python -m ruff check src/
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
