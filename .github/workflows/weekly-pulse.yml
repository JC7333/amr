name: weekly-pulse

# Routine 5 d'Audric â€” revue hebdo automatique dimanche 9h Paris.
# v4.1 : fix encoding UTF-8 + max_tokens + Node 24 forcÃ©.
#
# Secrets requis :
#   - ANTHROPIC_API_KEY : clÃ© API Anthropic
#   - GMAIL_USER : adresse Gmail (audric9@gmail.com)
#   - GMAIL_APP_PASSWORD : mot de passe d'application Gmail
#
# Timing :
#   - 0 7 * * 0 = dimanche 7h UTC = 9h Paris en Ã©tÃ©
#   - 0 8 * * 0 = dimanche 8h UTC = 9h Paris en hiver
#   Le job s'exÃ©cute UNE fois selon le mois (cron natif sans DST).

on:
  schedule:
    - cron: '0 7 * * 0'
    - cron: '0 8 * * 0'
  workflow_dispatch:

# Forcer Node 24 dÃ¨s maintenant (anticipation deprecation 2 juin 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  weekly-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install anthropic requests

      - name: Generate weekly pulse + send mail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python .github/scripts/weekly_pulse.py

      - name: Upload pulse as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-pulse-${{ github.run_id }}
          path: weekly-pulse/*.md
          retention-days: 90

      - name: Show pulse in summary
        if: always()
        run: |
          PULSE_FILE=$(ls -t weekly-pulse/*.md 2>/dev/null | head -1)
          if [ -n "$PULSE_FILE" ]; then
            echo "## Weekly Pulse $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat "$PULSE_FILE" >> $GITHUB_STEP_SUMMARY
          fi
